<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTM-TCY — Agent</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6B3B">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap');

:root{
  --green: #1F6B3B;
  --green-deep: #143F23;
  --orange: #C2571E;
  --cream: #F5F8F3;
  --ink: #1D2A21;
  --ink-soft: #6E7C71;
  --line: #DCE6DE;
  --gold: #C9A24A;
  --red: #B23A2E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream); color:var(--ink);
  font-family:'Work Sans',sans-serif; min-height:100vh; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.serif{ font-family:'Fraunces',serif; }

/* ---------------- Splash : logo animé ---------------- */
#splash{
  position:fixed; inset:0; background:var(--green);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:100; color:#fff;
}
#splash .mark{
  width:78px;height:78px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.5);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px; font-family:'Fraunces',serif; font-weight:700; font-size:24px;
  animation: pulse 1.3s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
#splash h1{ font-size:19px; margin:0; letter-spacing:0.5px; }
#splash span{ font-size:11px; letter-spacing:3px; opacity:0.85; margin-top:4px; }
#splash .tag{ font-size:11px; opacity:0.75; margin-top:18px; letter-spacing:1px; }

/* ---------------- Login (Identifiant) ---------------- */
#login{
  display:none; min-height:100vh; align-items:center; justify-content:center; padding:24px;
}
#login .box{
  background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px 24px;
  max-width:360px; width:100%; text-align:center;
}
#login .mark2{
  width:56px;height:56px;border-radius:50%; background:var(--green); color:#fff;
  display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  font-family:'Fraunces',serif; font-weight:700; font-size:18px;
}
#login h2{ font-family:'Fraunces',serif; font-size:19px; margin:0 0 4px; color:var(--green-deep); }
#login .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:18px; letter-spacing:1px; }
#login input{
  width:100%; padding:13px; border-radius:10px; border:1.5px solid var(--line);
  font-size:15px; text-align:center; letter-spacing:1px; margin-bottom:10px;
}
#login .err{ color:var(--red); font-size:12.5px; margin-bottom:10px; display:none; }
#login .btn{
  width:100%; padding:13px; border:none; border-radius:10px;
  background:var(--green); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
}
#login .hint{ font-size:11px; color:var(--ink-soft); margin-top:14px; }

/* ---------------- App shell ---------------- */
#app{ display:none; }
.topbar{
  background:var(--green); color:#fff; padding:20px 20px 22px; border-radius:0 0 20px 20px;
  display:flex; justify-content:space-between; align-items:flex-start;
}
.topbar .intl{ font-size:11px; letter-spacing:3px; opacity:0.85; margin-bottom:2px; }
.topbar h1{ font-family:'Fraunces',serif; font-size:22px; margin:0; font-weight:700; }
.topbar .agentTag{ font-size:11px; opacity:0.85; margin-top:4px; }
.logout{ background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.4); color:#fff;
  padding:6px 12px; border-radius:999px; font-size:11.5px; cursor:pointer; }

.content{ max-width:520px; margin:0 auto; padding:18px; }

.search-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
.search-card label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
.code-input{
  width:100%; padding:14px; border-radius:10px; border:1.5px solid var(--line);
  font-family:'Fraunces',serif; font-size:22px; letter-spacing:6px; text-align:center;
  text-transform:uppercase; margin-bottom:10px;
}
.btn{ width:100%; padding:13px; border:none; border-radius:10px; background:var(--green); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer; }

.result{ display:none; }
.result-card{
  border-radius:16px; padding:20px; margin-bottom:14px; color:#fff;
}
.result-card.ok{ background:linear-gradient(135deg, var(--green), var(--green-deep)); }
.result-card.used{ background:linear-gradient(135deg, #8A6D1F, #5C4712); }
.result-card.none{ background:linear-gradient(135deg, var(--red), #7A231A); }
.result-card .status-tag{ font-size:11px; letter-spacing:2px; opacity:0.9; margin-bottom:6px; }
.result-card h3{ font-family:'Fraunces',serif; font-size:20px; margin:0 0 12px; }
.result-card .line{ font-size:14px; margin-bottom:4px; }
.result-card .line b{ font-weight:700; }
.result-card .route{ font-size:16px; font-weight:700; margin:10px 0 2px; }

.actions{ display:flex; gap:10px; margin-top:14px; }
.actions .btn.secondary{ background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.4); }
.actions .btn.confirm{ background:#fff; color:var(--green-deep); }

.reset-link{ display:block; text-align:center; margin-top:10px; color:var(--ink-soft); font-size:13px; background:none; border:none; cursor:pointer; width:100%; }
</style>
</head>
<body>

<div id="splash">
  <div class="mark">CT</div>
  <h1 class="serif">CTM-TCY</h1>
  <span>INTERNATIONAL</span>
  <div class="tag">ESPACE AGENT</div>
</div>

<div id="login">
  <div class="box">
    <div class="mark2">CT</div>
    <h2>CTM-TCY International</h2>
    <div class="sub">ESPACE AGENT · CONTRÔLE</div>
    <input type="text" id="identInput" placeholder="Identifiant">
    <div class="err" id="identErr">Identifiant incorrect</div>
    <button class="btn" id="btnLogin">Se connecter</button>
    <div class="hint">Version de test — identifiant : CTM-TCY</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div>
      <div class="intl">CTM-TCY · INTERNATIONAL</div>
      <h1>Contrôle billet</h1>
      <div class="agentTag">Agent connecté</div>
    </div>
    <button class="logout" id="btnLogout">Déconnexion</button>
  </div>

  <div class="content">
    <div class="search-card">
      <label>Code du billet</label>
      <input type="text" class="code-input" id="codeInput" maxlength="6" placeholder="4K9B2P">
      <button class="btn" id="btnSearch">Vérifier le code</button>
    </div>

    <div class="result" id="result"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-R0xvWR0zoNv9-nzbPHaz_sPziX8vgGA",
  authDomain: "ctmtcy-test.firebaseapp.com",
  projectId: "ctmtcy-test",
  storageBucket: "ctmtcy-test.firebasestorage.app",
  messagingSenderId: "566569781223",
  appId: "1:566569781223:web:53192afd62f3517e341f42"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const VALID_IDENT = 'CTM-TCY'; // identifiant de test partagé — deviendra un matricule individuel plus tard

// ---------------- Splash → Login ----------------
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    document.getElementById('splash').style.display = 'none';
    document.getElementById('login').style.display = 'flex';
  }, 1500);
});

// ---------------- Login ----------------
function tryLogin(){
  const val = document.getElementById('identInput').value.trim().toUpperCase();
  if(val === VALID_IDENT){
    sessionStorage.setItem('ctmtcy_agent_ident', val);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }else{
    document.getElementById('identErr').style.display = 'block';
  }
}
document.getElementById('btnLogin').onclick = tryLogin;
document.getElementById('identInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryLogin(); });

document.getElementById('btnLogout').onclick = ()=>{
  sessionStorage.removeItem('ctmtcy_agent_ident');
  document.getElementById('app').style.display = 'none';
  document.getElementById('identInput').value = '';
  document.getElementById('identErr').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
};

// Si déjà connecté dans cette session (évite de retaper à chaque rechargement)
if(sessionStorage.getItem('ctmtcy_agent_ident') === VALID_IDENT){
  window.addEventListener('load', ()=>{
    document.getElementById('splash').style.display = 'none';
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  });
}

// ---------------- Recherche / validation de code ----------------
document.getElementById('btnSearch').onclick = async ()=>{
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const resultBox = document.getElementById('result');
  if(!code){ return; }
  resultBox.style.display = 'block';
  resultBox.innerHTML = '<div class="result-card ok"><div class="status-tag">RECHERCHE...</div><h3>Vérification en cours</h3></div>';

  try{
    const ref = doc(db, 'reservations', code);
    const snap = await getDoc(ref);

    if(!snap.exists()){
      resultBox.innerHTML = `
        <div class="result-card none">
          <div class="status-tag">CODE INTROUVABLE</div>
          <h3>Aucune réservation avec ce code</h3>
          <div class="line">Vérifiez la saisie avec le passager.</div>
        </div>`;
      return;
    }

    const b = snap.data();
    const d = new Date(b.date);
    const dateStr = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'});

    if(b.statut === 'utilise'){
      resultBox.innerHTML = `
        <div class="result-card used">
          <div class="status-tag">⚠ DÉJÀ UTILISÉ</div>
          <h3>${b.nom}</h3>
          <div class="line">Pièce : <b>${b.piece}</b></div>
          <div class="route">${b.depart} → ${b.destination}</div>
          <div class="line">${dateStr} · Départ ${b.heure} · ${b.prix} FCFA</div>
          <div class="line" style="margin-top:8px;">Validé le : ${b.valideLe ? new Date(b.valideLe).toLocaleString('fr-FR') : '—'}</div>
        </div>`;
      return;
    }

    resultBox.innerHTML = `
      <div class="result-card ok">
        <div class="status-tag">✔ BILLET VALIDE</div>
        <h3>${b.nom}</h3>
        <div class="line">Pièce d'identité : <b>${b.piece}</b></div>
        <div class="route">${b.depart} → ${b.destination}</div>
        <div class="line">${dateStr} · Départ ${b.heure} · ${b.prix} FCFA</div>
        <div class="actions">
          <button class="btn confirm" id="btnValider">Valider l'embarquement</button>
        </div>
      </div>`;

    document.getElementById('btnValider').onclick = async ()=>{
      await updateDoc(ref, {
        statut: 'utilise',
        valideLe: new Date().toISOString(),
        valideParAgent: sessionStorage.getItem('ctmtcy_agent_ident') || VALID_IDENT
      });
      document.getElementById('btnSearch').click(); // rafraîchit l'affichage avec le nouveau statut
    };

  }catch(err){
    resultBox.innerHTML = `<div class="result-card none"><div class="status-tag">ERREUR</div><h3>Connexion impossible</h3><div class="line">${err.message}</div></div>`;
  }
};

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
